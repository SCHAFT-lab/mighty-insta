<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マイティ・インスタ v3.1 (マルチデバイス対応)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/mighty.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
    <style>
        :root {
            --bg-color: #fcfbf4;
            --accent-gold: #d4af37;
            --text-dark: #333333;
            --font-gothic: 'Noto Sans JP', sans-serif;
            --font-mincho: 'Noto Serif JP', serif;
        }

        body {
            margin: 0;
            font-family: var(--font-gothic);
            background-color: #eef2f6;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Layout --- */
        .container {
            display: flex;
            flex-direction: row; /* Default PC: Horizontal */
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 1000px) {
            body { padding: 10px; }
            .container {
                flex-direction: column; /* Mobile: Vertical */
                align-items: center;
                gap: 15px;
            }
            .sidebar, .preview-area {
                width: 100% !important;
                max-width: 600px;
            }
            .sidebar { order: 2; }
            .preview-area { order: 1; }
            .gen-top-mobile { display: block !important; }
            .gen-sidebar-pc { display: none !important; }
        }

        .sidebar {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            flex-grow: 1;
        }

        /* --- Components --- */
        .section-box {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: bold; color: #444; }
        input, textarea, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; -webkit-appearance: none; }
        
        /* Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            outline: none;
            margin: 10px 0;
            border: none; /* Hide default border box */
            padding: 0;   /* Remove padding that causes overflow */
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            background: #007aff; /* Blue color as requested */
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 2px solid white;
        }

        button { padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-generate { background-color: var(--accent-gold); color: white; }
        .btn-download { background-color: #333; color: white; font-size: 16px; width: 100%; }
        .btn-copy { background-color: #eee; color: #333; font-size: 14px; }

        /* --- Insta Post --- */
        #post-scaler {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: visible;
        }
        #insta-post {
            width: 600px;
            height: 750px;
            background-color: var(--bg-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            transform-origin: top center;
            flex-shrink: 0;
        }
        .post-header { display: flex; justify-content: center; align-items: center; height: 120px; margin-bottom: 20px; }
        .category-title { font-weight: 900; padding-bottom: 6px; border-bottom: 8px solid var(--accent-gold); display: inline-block; line-height: 1.2; text-align: center; }
        .mascot-area { position: absolute; right: 10px; bottom: 40px; width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .mascot-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .content-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 80px; }
        .main-quote { font-weight: 900; text-align: center; width: 100%; line-height: 1.4; white-space: pre-wrap; word-break: break-all; z-index: 5; }
        .post-footer { margin-top: auto; display: flex; justify-content: center; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.05); width: 100%; }
        .school-name { font-size: 25px; font-weight: 900; opacity: 0.6; }

        .loading-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; font-weight: bold; color: var(--accent-gold);
        }
        .placeholder-box { width: 100%; height: 100%; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; }
        
        .gen-top-mobile { display: none; margin-bottom: 15px; } /* Only for mobile */
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar (PC: Left, Mobile: Bottom) -->
        <div class="sidebar">
            <div class="section-box gen-sidebar-pc">
                <h3 style="margin:0; color:var(--accent-gold); font-size:16px;">Mighty Insta v3.1</h3>
                <div class="input-group">
                    <label>Gemini API Key</label>
                    <input type="password" class="apiKey" placeholder="キーを入力">
                </div>
                <div class="input-group">
                    <label>人名・名前</label>
                    <input type="text" class="targetInput" placeholder="例: 蜷川幸雄">
                    <button class="generateBtn btn-generate">✨ 新しい名言を生成</button>
                </div>
            </div>

            <div class="section-box">
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>タイトルサイズ: <span id="catSizeVal">60</span>px</label>
                        <input type="range" id="catSizeSlider" min="20" max="100" value="60">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>名言サイズ: <span id="quoteSizeVal">60</span>px</label>
                        <input type="range" id="quoteSizeSlider" min="30" max="150" value="60">
                    </div>
                </div>
                <div class="input-group">
                    <label>名言の修正・改行</label>
                    <textarea id="quoteInput" rows="2" placeholder="直接入力・修正"></textarea>
                </div>
            </div>

            <div class="section-box">
                <div class="input-group">
                    <label>キャプション案</label>
                    <textarea id="bodyInput" rows="6" style="font-size:14px;"></textarea>
                    <button id="copyBtn" class="btn-copy">📋 キャプションをコピー</button>
                </div>
                <button id="downloadBtn" class="btn-download">📥 画像を保存する</button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="preview-area">
            <!-- Mobile Top Input -->
            <div class="section-box gen-top-mobile">
                <h3 style="margin:0; color:var(--accent-gold); font-size:16px; margin-bottom:10px;">Mighty Insta v3.1</h3>
                <div class="input-group">
                    <label>API Key</label>
                    <input type="password" class="apiKey" placeholder="キーを入力">
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label>名前</label>
                    <input type="text" class="targetInput" placeholder="蜷川幸雄など">
                    <button class="generateBtn btn-generate" style="margin-top:5px;">✨ 名言生成</button>
                </div>
            </div>

            <div id="post-scaler">
                <div id="insta-post">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div style="font-size: 30px; margin-bottom: 10px;">🎨</div>
                        生成中...
                    </div>
                    <div class="post-header"><div class="category-title" id="displayCategory">タイトルの言葉</div></div>
                    <div class="content-area"><div class="main-quote" id="displayQuote">名言</div></div>
                    <div class="mascot-area" id="mascotPreview"><div class="placeholder-box">Mighty</div></div>
                    <div class="post-footer"><div class="school-name">舞台スタッフの学校</div></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://cdn.jsdelivr.net/npm/@google/generative-ai/+esm";

        // Handle duplicate elements for PC/Mobile
        const getEl = (cls) => document.querySelector(cls);
        const getAllEls = (cls) => document.querySelectorAll(cls);

        const els = {
            apiKeys: getAllEls('.apiKey'),
            targets: getAllEls('.targetInput'),
            genBtns: getAllEls('.generateBtn'),
            dlBtn: document.getElementById('downloadBtn'),
            copyBtn: document.getElementById('copyBtn'),
            loading: document.getElementById('loadingOverlay'),
            catIn: { value: "" },
            quoteIn: document.getElementById('quoteInput'),
            bodyIn: document.getElementById('bodyInput'),
            catDisp: document.getElementById('displayCategory'),
            quoteDisp: document.getElementById('displayQuote'),
            catSlider: document.getElementById('catSizeSlider'),
            quoteSlider: document.getElementById('quoteSizeSlider'),
            catSizeVal: document.getElementById('catSizeVal'),
            quoteSizeVal: document.getElementById('quoteSizeVal'),
            mascotPreview: document.getElementById('mascotPreview')
        };

        const syncUI = () => {
            els.catDisp.innerText = els.catIn.value || 'タイトルの言葉';
            els.catDisp.style.fontSize = els.catSlider.value + 'px';
            els.quoteDisp.innerText = els.quoteIn.value || '名言';
            els.quoteDisp.style.fontSize = els.quoteSlider.value + 'px';
            els.catSizeVal.innerText = els.catSlider.value;
            els.quoteSizeVal.innerText = els.quoteSlider.value;
        };

        const rescalePreview = () => {
            const container = document.getElementById('post-scaler');
            const post = document.getElementById('insta-post');
            const availableWidth = container.offsetWidth;
            const originalWidth = 600;
            if (availableWidth < originalWidth) {
                const scale = availableWidth / originalWidth;
                post.style.transform = `scale(${scale})`;
                container.style.height = (750 * scale) + 'px';
            } else {
                post.style.transform = 'none';
                container.style.height = '750px';
            }
        };

        window.addEventListener('resize', rescalePreview);
        window.addEventListener('load', rescalePreview);
        [els.catSlider, els.quoteSlider, els.quoteIn].forEach(el => el.addEventListener('input', syncUI));

        // Sync inputs between mobile and PC hidden versions
        els.apiKeys.forEach(input => {
            input.value = localStorage.getItem('mighty_key') || '';
            input.addEventListener('input', (e) => els.apiKeys.forEach(other => other.value = e.target.value));
        });
        els.targets.forEach(input => {
            input.addEventListener('input', (e) => els.targets.forEach(other => other.value = e.target.value));
        });

        els.genBtns.forEach(btn => btn.addEventListener('click', async () => {
            const key = els.apiKeys[0].value.trim();
            const target = els.targets[0].value.trim();
            if (!key || !target) return alert('API Keyと名前を入力してください');
            
            localStorage.setItem('mighty_key', key);
            els.loading.style.display = 'flex';
            
            try {
                const genAI = new GoogleGenerativeAI(key);
                const prompt = `あなたは「マイティ」という名の20歳の若手スタッフです。${target}の名言を一つ選び、以下の条件でインスタ投稿案を作成してください。

                【絶対条件】
                1. 名言(quote): インパクトのある短い言葉。句読点（。、）は一切入れない。
                2. 本文(body): 冒頭は必ず「おはようございます！マイティだよ。」から始めてください。
                3. キャラクター設定: あなたは20歳で、まだ現場に入ったばかりの新米です。偉そうな「先輩」ではなく、高校生や同世代の仲間に対して「僕もまだ勉強中だけど、一緒に頑張ろう」という謙虚で優しく、穏やかな口調で語りかけてください。
                4. 本文の内容: その名言を読んで、自分（新人のマイティ）がどう感じたか、どう励まされたかを140文字程度で等身大に伝えてください。
                5. ハッシュタグ: #舞台スタッフの学校 #名言 #演劇 #舞台 を含み、ハッシュタグは合計で5つまでにしてください。
                6. フォーマット: 本文は20文字〜30文字ごとに改行を入れ、スマホ画面で見たときに読みやすいようにしてください。句読点（。、）を適切に入れてください。
                
                JSON: {"category":"${target}の言葉","quote":"名言","body":"おはようございます！マイティだよ。\n\n（20-30文字で改行された本文）\n\n#ハッシュタグ1 #ハッシュタグ2 ..."}`;

                // Try multiple models in order of preference
                const models = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-flash-8b", "gemini-1.5-pro"];
                let lastError = null;
                let responseText = null;

                for (const modelName of models) {
                    try {
                        console.log(`Trying model: ${modelName}...`);
                        const model = genAI.getGenerativeModel({ model: modelName });
                        const result = await model.generateContent(prompt);
                        responseText = await result.response.text();
                        if (responseText) {
                            console.log(`Success with model: ${modelName}`);
                            break; 
                        }
                    } catch (err) {
                        console.warn(`Model ${modelName} failed:`, err.message);
                        lastError = err;
                        // Continue to next model
                    }
                }

                if (!responseText) throw lastError || new Error("どのモデルでも生成できませんでした。");

                const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("JSON形式のレスポンスが見つかりませんでした");
                const json = JSON.parse(jsonMatch[0]);
                
                // Final check formatting if Gemini didn't follow perfectly
                const formatBody = (text) => {
                    if (!text) return '';
                    return text.split('\n').map(line => {
                        if (line.startsWith('#')) return line; // Don't wrap hashtags
                        let res = '';
                        for (let i = 0; i < line.length; i += 25) {
                            res += line.substring(i, i + 25) + (line.length > i + 25 ? '\n' : '');
                        }
                        return res;
                    }).join('\n');
                };

                els.catIn.value = json.category;
                els.quoteIn.value = json.quote;
                els.bodyIn.value = formatBody(json.body);
                syncUI();
                rescalePreview();
            } catch (err) { 
                console.error(err);
                
                // Diagnostic: Try to fetch available models
                let modelListMsg = "";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                    const data = await response.json();
                    if (data.models) {
                        modelListMsg = "\n\n利用可能なモデル一覧:\n" + data.models.map(m => m.name.replace("models/", "")).join(", ");
                    }
                } catch (diagErr) {
                    modelListMsg = "\n\nモデル一覧の取得にも失敗しました。";
                }

                alert('エラー: ' + err.message + '\n' + modelListMsg + '\n\n新しいAPIキーを貼り付けたか確認してください。一覧に何も出ない場合は、プロジェクトの設定が完了していません。'); 
            } finally { 
                els.loading.style.display = 'none'; 
            }
        }));

        els.copyBtn.addEventListener('click', () => { els.bodyIn.select(); document.execCommand('copy'); alert('コピー完了！'); });

        els.dlBtn.addEventListener('click', () => {
            const post = document.getElementById('insta-post');
            const oldTransform = post.style.transform;
            post.style.transform = 'none';
            html2canvas(post, { scale: 1080/600, useCORS: true, width: 600, height: 750 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `mighty_post_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                post.style.transform = oldTransform;
            });
        });

        const loadDefaultMascot = () => {
            const path = 'assets/mighty.png';
            const img = new Image();
            img.onload = () => { els.mascotPreview.innerHTML = `<img src="${path}" />`; rescalePreview(); };
            img.src = path;
        };
        loadDefaultMascot();
        syncUI();
    </script>
</body>
</html>
